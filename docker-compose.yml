services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dental-care-app
    ports:
      - "9002:9002"
    environment:
      NODE_ENV: production
      PORT: 9002
      MONGODB_URI: mongodb://root:root@mongo:27017/dentalcare?authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: dental-care-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: dentalcare
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
