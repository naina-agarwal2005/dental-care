<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#30568b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a6fa5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9f5ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>
  
  <!-- Shield background for protection symbol -->
  <path d="M256 60 C200 60 150 80 120 100 L120 240 C120 360 180 440 256 460 C332 440 392 360 392 240 L392 100 C362 80 312 60 256 60 Z" 
        fill="#006971" opacity="0.3"/>
  
  <!-- Medical cross / First Aid symbol -->
  <g transform="translate(256, 256)">
    <!-- Horizontal bar -->
    <rect x="-120" y="-45" width="240" height="90" rx="20" fill="url(#crossGradient)"/>
    <!-- Vertical bar -->
    <rect x="-45" y="-120" width="90" height="240" rx="20" fill="url(#crossGradient)"/>
    
    <!-- Center circle accent -->
    <circle cx="0" cy="0" r="55" fill="#834600" opacity="0.15"/>
  </g>
  
  <!-- Subtle highlight for depth -->
  <circle cx="200" cy="150" r="40" fill="#ffffff" opacity="0.15"/>
</svg>
